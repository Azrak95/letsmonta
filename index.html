<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LetsMonta!</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LetsMonta!">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app_icon.png">
  <link rel="icon" type="image/png" href="app_icon.png">
  <style>
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
      --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
      --green: #2ea043; --green-light: #56d364; --green-bg: #0d2d17; --green-border: #2ea043;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); overflow: hidden; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; transition: opacity 0.25s, transform 0.25s; overflow: hidden; }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

    /* ── BUBBLES ── */
    .bubbles-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }

    /* ── PICK SCREEN ── */
    #pickScreen { background: var(--bg); }
    .pick-title {
      position: relative; z-index: 2;
      text-align: center;
      padding: calc(env(safe-area-inset-top, 8px) + 8px) 1rem 0.25rem;
      font-size: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--text);
      flex-shrink: 0;
    }
    .pick-hero {
      position: relative; z-index: 2;
      width: 100%; height: 130px; flex-shrink: 0; overflow: hidden;
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
    .hero-fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
      background: linear-gradient(to bottom, transparent 0%, rgba(13,17,23,0.7) 50%, #0d1117 100%);
    }
    .pick-body {
      position: relative; z-index: 2;
      flex: 1; padding: 0.5rem 0.875rem 0.25rem;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pick-label {
      font-size: 11px; color: var(--text3); text-transform: uppercase;
      letter-spacing: 1px; text-align: center; margin-bottom: 0.4rem; flex-shrink: 0;
    }
    .profiles-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; flex: 1; align-content: start;
    }
    .profile-card {
      background: rgba(22,27,34,0.8); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.5rem 0.375rem 0.4rem;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .profile-card:active { transform: scale(0.96); }
    .profile-card:hover { border-color: var(--border2); }
    .profile-card.taken { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .p-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--bg3); }
    .p-name { font-size: 11px; font-weight: 600; color: var(--text); }
    .p-taken { font-size: 10px; color: var(--text3); }

    /* ── MAIN SCREEN ── */
    #mainScreen { background: var(--bg); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 12px) + 12px) 1.25rem 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 2;
    }
    .topbar-logo { font-size: 17px; font-weight: 700; }
    .topbar-user { display: flex; align-items: center; gap: 8px; }
    .topbar-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: top; }
    .topbar-name { font-size: 14px; font-weight: 600; }

    .main-body {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 1.25rem 1.5rem 1rem; gap: 0.875rem; position: relative; z-index: 2;
      overflow: hidden; min-height: 0;
    }

    /* ── MONTA BUTTON ── */
    .monta-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .monta-btn {
      width: 160px; height: 160px; border-radius: 50%;
      border: 2.5px solid var(--border2);
      background-color: var(--bg2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
      user-select: none; -webkit-user-select: none;
    }
    .monta-btn:active { transform: scale(0.93); }
    .monta-btn-bg {
      position: absolute; inset: 0; border-radius: 50%;
      background-size: cover; background-position: center top;
      transition: opacity 0.4s ease;
    }
    .monta-btn-bg-off { background-image: url('bg_off.png'); opacity: 0.5; }
    .monta-btn-bg-on  { background-image: url('bg_monta.png'); opacity: 0; }
    .monta-btn.active .monta-btn-bg-off { opacity: 0; }
    .monta-btn.active .monta-btn-bg-on  { opacity: 0.5; }
    .monta-btn.active { border-color: var(--green-border); box-shadow: 0 0 0 5px rgba(46,160,67,0.2), 0 0 28px rgba(46,160,67,0.15); }
    .monta-btn-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .monta-text {
      font-size: 14px; font-weight: 800; color: #ffffff;
      letter-spacing: 0.8px; text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 12px rgba(0,0,0,0.8);
      transition: color 0.2s;
    }
    .monta-btn.active .monta-text { color: var(--green-light); }
    .monta-caption {
      font-size: 15px; font-weight: 600; color: #c9d1d9; text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .monta-caption.on { color: var(--green-light); font-size: 16px; }

    /* ── OTHERS ── */
    .others-wrap { width: 100%; max-width: 380px; flex-shrink: 0; }
    .others-heading { font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .others-list { display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
    .other-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius-sm); animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }
    .other-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; }
    .other-name { font-size: 14px; font-weight: 600; color: var(--green-light); flex: 1; }
    .other-tag { font-size: 11px; color: var(--green); }
    .no-others { font-size: 14px; color: var(--text3); }

    .logout-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; color: var(--text2); cursor: pointer; padding: 4px 10px; white-space: nowrap; }
    .logout-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ── CHAT ── */
    .chat-wrap { width: 100%; max-width: 380px; display: none; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .chat-wrap.visible { display: flex; }
    .chat-heading { font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
    .chat-messages { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; padding-right: 2px; min-height: 0; }
    .chat-msg { display: flex; align-items: flex-start; gap: 8px; animation: slideIn 0.2s ease; }
    .chat-msg-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; margin-top: 2px; }
    .chat-msg-body { background: rgba(22,27,34,0.85); border: 1px solid var(--border); border-radius: 10px 10px 10px 2px; padding: 6px 10px; backdrop-filter: blur(6px); max-width: 80%; }
    .chat-msg-name { font-size: 10px; color: var(--green); font-weight: 600; margin-bottom: 2px; }
    .chat-msg-text { font-size: 13px; color: var(--text); line-height: 1.4; word-break: break-word; }
    .chat-msg.own { flex-direction: row-reverse; }
    .chat-msg.own .chat-msg-body { background: rgba(13,45,23,0.9); border-color: var(--green-border); border-radius: 10px 10px 2px 10px; }
    .chat-msg.own .chat-msg-name { color: var(--green-light); text-align: right; }
    .chat-input-row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .chat-input { flex: 1; background: rgba(22,27,34,0.85); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; font-size: 13px; color: var(--text); outline: none; font-family: inherit; }
    .chat-input::placeholder { color: var(--text3); }
    .chat-input:focus { border-color: var(--green-border); }
    .chat-send { background: var(--green); border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
    .chat-send:active { transform: scale(0.95); }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 1.25rem); left: 50%; transform: translateX(-50%) translateY(120px); background: var(--bg3); border: 1px solid var(--green-border); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; gap: 10px; width: calc(100% - 2.5rem); max-width: 360px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; }
    .toast-title { font-size: 13px; font-weight: 700; color: var(--green-light); }
    .toast-msg { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 9999; transition: opacity 0.3s; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; }
    .loading-text { font-size: 14px; color: var(--text3); }
  </style>
</head>

<script>
function initBubbles(canvasId) {
  const canvas = document.getElementById(canvasId);
  const parent = canvas.parentElement;
  function resize() {
    canvas.width = parent.offsetWidth;
    canvas.height = parent.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  const ctx = canvas.getContext('2d');
  const bubbles = Array.from({length: 32}, () => ({
    x: Math.random() * canvas.width,
    y: canvas.height + Math.random() * canvas.height * 0.5,
    r: 1.5 + Math.random() * 4.5,
    speed: 0.35 + Math.random() * 0.7,
    opacity: 0.07 + Math.random() * 0.16,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.018 + Math.random() * 0.028,
  }));
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(b => {
      b.y -= b.speed;
      b.wobble += b.wobbleSpeed;
      const x = b.x + Math.sin(b.wobble) * 2.5;
      if (b.y + b.r < 0) {
        b.y = canvas.height + b.r;
        b.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(251,191,36,${b.opacity})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,100,${b.opacity * 0.55})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyAg6VpZZSlfS7zXuH8aklndJKgLlM1SmCM",
  authDomain: "letsmonta.firebaseapp.com",
  databaseURL: "https://letsmonta-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "letsmonta",
  storageBucket: "letsmonta.firebasestorage.app",
  messagingSenderId: "827368602785",
  appId: "1:827368602785:web:d6df974b604243579d04e0"
};

const VAPID_KEY = "BPW1z89E8Uw5308WBIWh7S9k2tjR31NHwGOEikYOEjoLtmi0-6woGrS93ETEgDsJMPGLp0fbf5RAbBJHU_dfKCI";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messaging = getMessaging(app);

const MEMBERS = [
  { id: 'Monir',   name: 'Monir',     avatar: 'avatars/Monir.png' },
  { id: 'Bego',    name: 'Bego',      avatar: 'avatars/Bego.png' },
  { id: 'David',   name: 'David',     avatar: 'avatars/David.png' },
  { id: 'Bea',     name: 'Bea',       avatar: 'avatars/Bea.png' },
  { id: 'Miriam',  name: 'Miriam',    avatar: 'avatars/Miriam.png' },
  { id: 'Edu',     name: 'Edu',       avatar: 'avatars/Edu.png' },
  { id: 'MiriamG', name: 'Miriam G.', avatar: 'avatars/MiriamG.png' },
  { id: 'Pincho',  name: 'Pincho',    avatar: 'avatars/Pincho.png' },
  { id: 'Pipe',    name: 'Pipe',      avatar: 'avatars/Pipe.png' },
  { id: 'Sheyla',  name: 'Sheyla',    avatar: 'avatars/Sheyla.png' },
  { id: 'Maria',   name: 'María',     avatar: 'avatars/Maria.png' },
  { id: 'Kiki',    name: 'Kiki',      avatar: 'avatars/Kiki.png' },
  { id: 'Idoia',   name: 'Idoia',     avatar: 'avatars/Idoia.png' },
];

const SESSION_KEY = 'letsmonta_session';
let currentUser = null;
let toastTimeout = null;
let prevActiveIds = [];
let unsubscribeActive = null;
let unsubscribeTaken = null;

function getMember(id) { return MEMBERS.find(m => m.id === id); }

async function setupPush(userId) {
  try {
    if (!('Notification' in window)) return;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const sw = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: sw });
    console.log('FCM token:', token ? 'obtained' : 'null');
    if (token) {
      await set(ref(db, `tokens/${userId}`), token);
      console.log('Token saved for', userId);
    }
    onMessage(messaging, payload => {
      const m = getMember(payload.data?.senderId);
      if (m) showToast(m);
    });
  } catch (e) {
    console.error('Push error:', e.message, e.code);
  }
}

async function init() {
  await cleanStaleSessions();
  const savedId = localStorage.getItem(SESSION_KEY);
  if (savedId) {
    const snap = await get(ref(db, `taken/${savedId}`));
    if (snap.exists() && snap.val() === savedId) {
      currentUser = getMember(savedId);
      if (currentUser) { hideLoading(); showMain(); return; }
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  }
  hideLoading();
  showPick();
}

function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

function showPick() {
  document.getElementById('pickScreen').classList.remove('hidden');
  document.getElementById('mainScreen').classList.add('hidden');
  initBubbles('pickBubbles');
  // Load real bar image
  document.getElementById('heroImg').src = 'app_icon.png';
  if (unsubscribeTaken) unsubscribeTaken();
  unsubscribeTaken = onValue(ref(db, 'taken'), snap => renderPick(snap.val() || {}));
}

function renderPick(taken) {
  const grid = document.getElementById('profilesGrid');
  grid.innerHTML = '';
  MEMBERS.forEach(m => {
    const isTaken = taken[m.id] && taken[m.id] !== currentUser?.id;
    const card = document.createElement('div');
    card.className = 'profile-card' + (isTaken ? ' taken' : '');
    card.innerHTML = `
      <img class="p-avatar" src="${m.avatar}" alt="${m.name}" loading="lazy">
      <span class="p-name">${m.name}</span>
      ${isTaken ? '<span class="p-taken">ocupado</span>' : ''}
    `;
    if (!isTaken) card.onclick = () => pickProfile(m.id);
    grid.appendChild(card);
  });
}

async function pickProfile(id) {
  if (unsubscribeTaken) { unsubscribeTaken(); unsubscribeTaken = null; }
  await set(ref(db, `taken/${id}`), id);
  localStorage.setItem(SESSION_KEY, id);
  currentUser = getMember(id);
  showMain();
}

function showMain() {
  document.getElementById('pickScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('topbarAvatar').src = currentUser.avatar;
  document.getElementById('topbarName').textContent = currentUser.name;
  initBubbles('mainBubbles');
  setupPush(currentUser.id);
  startChat();
  startHeartbeat();
  if (unsubscribeActive) unsubscribeActive();
  unsubscribeActive = onValue(ref(db, 'active'), snap => {
    const active = snap.val() || {};
    const newActiveIds = Object.keys(active).filter(k => k !== currentUser.id);
    newActiveIds.filter(k => !prevActiveIds.includes(k)).forEach(k => {
      const m = getMember(k);
      if (m) showToast(m);
    });
    prevActiveIds = newActiveIds;
    renderMain(active);
  });
  window.addEventListener('beforeunload', cleanup);
}

function renderMain(active) {
  const id = currentUser.id;
  const isOn = !!active[id];
  document.getElementById('montaBtn').classList.toggle('active', isOn);
  document.getElementById('montaText').textContent = isOn ? '¡Activo!' : 'Modo Monta';
  const caption = document.getElementById('montaCaption');
  caption.textContent = isOn ? '¡Estás en modo monta!' : 'Pulsa para activar';
  caption.className = 'monta-caption' + (isOn ? ' on' : '');
  const others = Object.keys(active).filter(k => k !== id);
  const list = document.getElementById('othersList');
  list.innerHTML = '';
  if (others.length === 0) {
    list.innerHTML = '<p class="no-others">Nadie más de momento...</p>';
  } else {
    others.forEach(k => {
      const m = getMember(k);
      if (!m) return;
      const row = document.createElement('div');
      row.className = 'other-row';
      row.innerHTML = `
        <img class="other-avatar" src="${m.avatar}" alt="${m.name}">
        <span class="other-name">${m.name}</span>
        <span class="other-tag">en modo monta 🔥</span>
      `;
      list.appendChild(row);
    });
  }

  const totalActive = Object.keys(active).length;
  const chatWrap = document.getElementById("chatWrap");
  if (totalActive >= 2) chatWrap.classList.add("visible");
  else chatWrap.classList.remove("visible");
}

let unsubscribeChat = null;
function startChat() {
  if (unsubscribeChat) unsubscribeChat();
  unsubscribeChat = onValue(ref(db, "chat"), snap => {
    const msgs = snap.val() || {};
    const container = document.getElementById("chatMessages");
    const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;
    container.innerHTML = "";
    Object.values(msgs).sort((a,b) => a.ts - b.ts).forEach(msg => {
      const isOwn = msg.userId === currentUser.id;
      const m = getMember(msg.userId);
      if (!m) return;
      const div = document.createElement("div");
      div.className = "chat-msg" + (isOwn ? " own" : "");
      div.innerHTML = `<img class="chat-msg-av" src="${m.avatar}" alt="${m.name}"><div class="chat-msg-body"><div class="chat-msg-name">${m.name}</div><div class="chat-msg-text">${msg.text}</div></div>`;
      container.appendChild(div);
    });
    if (wasAtBottom) container.scrollTop = container.scrollHeight;
  });
}
window.sendChat = async function() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  await set(ref(db, "chat/" + Date.now()), { userId: currentUser.id, text, ts: Date.now() });
};
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.activeElement === document.getElementById("chatInput")) window.sendChat();
});

window.toggleMonta = async function() {
  const id = currentUser.id;
  const snap = await get(ref(db, `active/${id}`));
  if (snap.exists()) {
    await remove(ref(db, `active/${id}`));
    const activeSnap = await get(ref(db, 'active'));
    if (!activeSnap.exists() || Object.keys(activeSnap.val()).length === 0) {
      await remove(ref(db, 'chat'));
    }
  } else {
    await set(ref(db, `active/${id}`), Date.now());
    await set(ref(db, `notify`), { senderId: id, senderName: currentUser.name, ts: Date.now(), sent: false });
  }
};

function showToast(member) {
  document.getElementById('toastAv').src = member.avatar;
  document.getElementById('toastTitle').textContent = member.name;
  const t = document.getElementById('toast');
  t.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 4000);
}

async function cleanup() {
  if (!currentUser) return;
  stopHeartbeat();
  await remove(ref(db, `active/${currentUser.id}`));
  // Keep token so push notifications still work when app is closed
}

window.logout = async function() {
  stopHeartbeat();
  if (unsubscribeActive) { unsubscribeActive(); unsubscribeActive = null; }
  if (currentUser) {
    await remove(ref(db, `active/${currentUser.id}`));
    await remove(ref(db, `taken/${currentUser.id}`));
    // Keep token for push notifications
  if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
  }
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  prevActiveIds = [];
  document.getElementById('mainScreen').classList.add('hidden');
  showPick();
};


let heartbeatInterval = null;

function startHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  const id = currentUser.id;
  const updateHeartbeat = () => set(ref(db, `heartbeat/${id}`), Date.now());
  updateHeartbeat();
  heartbeatInterval = setInterval(updateHeartbeat, 30000);
}

function stopHeartbeat() {
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if (currentUser) remove(ref(db, `heartbeat/${currentUser.id}`));
}

// Check for stale taken profiles on load and clean them up
async function cleanStaleSessions() {
  const [takenSnap, heartbeatSnap] = await Promise.all([
    get(ref(db, 'taken')),
    get(ref(db, 'heartbeat'))
  ]);
  if (!takenSnap.exists()) return;
  const taken = takenSnap.val();
  const heartbeats = heartbeatSnap.exists() ? heartbeatSnap.val() : {};
  const now = Date.now();
  const updates = {};
  const activeSnap = await get(ref(db, 'active'));
  const active = activeSnap.exists() ? activeSnap.val() : {};
  Object.keys(taken).forEach(id => {
    const last = heartbeats[id] || 0;
    const isInMontaMode = !!active[id];
    // Only release profile if no heartbeat AND not in monta mode
    if (now - last > 180000 && !isInMontaMode) {
      updates[`taken/${id}`] = null;
      updates[`heartbeat/${id}`] = null;
    }
  });
  if (Object.keys(updates).length > 0) {
    await Promise.all(Object.entries(updates).map(([path, val]) =>
      val === null ? remove(ref(db, path)) : set(ref(db, path), val)
    ));
    console.log('Cleaned stale sessions:', Object.keys(updates));
  }
}

let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBanner').classList.add('visible');
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('visible');
  deferredInstallPrompt = null;
});

window.installApp = async function() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('installBanner').classList.remove('visible');
  }
  deferredInstallPrompt = null;
};

async function initApp() {
  const banner = document.getElementById('installBanner');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS || isStandalone) {
    banner.style.display = 'none';
  }
  await init();
}

initApp();
</script>
