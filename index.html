<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LetsMonta!</title>
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LetsMonta!">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app_icon.png">
  <link rel="icon" type="image/png" href="app_icon.png">
  <style>
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
      --text: #e6edf3; --text2: #8b949e; --text3: #484f58;
      --green: #2ea043; --green-light: #56d364; --green-bg: #0d2d17; --green-border: #2ea043;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); overflow: hidden; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; transition: opacity 0.25s, transform 0.25s; }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }
    #pickScreen { background: var(--bg); overflow-y: auto; }
    .pick-inner { padding: 2rem 1.25rem; max-width: 480px; margin: 0 auto; }
    .logo-wrap { text-align: center; margin-bottom: 2rem; }
    .logo-img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; margin-bottom: 0.75rem; }
    .logo-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .logo-sub { font-size: 14px; color: var(--text2); margin-top: 4px; }
    .pick-label { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 1.25rem; letter-spacing: 0.3px; text-transform: uppercase; }
    .profiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .profile-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 0.5rem 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .profile-card:active { transform: scale(0.97); }
    .profile-card:hover { border-color: var(--border2); background: var(--bg3); }
    .profile-card.taken { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    .p-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--bg3); }
    .p-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .p-taken { font-size: 10px; color: var(--text3); }
    #mainScreen { background: var(--bg); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 12px) + 12px) 1.25rem 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .topbar-logo { font-size: 17px; font-weight: 700; }
    .topbar-user { display: flex; align-items: center; gap: 8px; }
    .topbar-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: top; }
    .topbar-name { font-size: 14px; font-weight: 600; }
    .main-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 2.5rem 1.5rem 2rem; gap: 2rem; }
    .monta-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .monta-btn { width: 170px; height: 170px; border-radius: 50%; border: 2px solid var(--border2); background-color: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; user-select: none; -webkit-user-select: none; }
    .monta-btn:active { transform: scale(0.93); }
    .monta-btn::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background-image: url('bg_monta.png'); background-size: cover; background-position: center top; opacity: 0; transition: opacity 0.4s ease; }
    .monta-btn.active::before { opacity: 0.45; }
    .monta-btn.active { border-color: var(--green-border); box-shadow: 0 0 0 4px rgba(46,160,67,0.2), 0 0 24px rgba(46,160,67,0.15); }
    .monta-btn-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .monta-icon { font-size: 44px; transition: transform 0.3s; }
    .monta-btn.active .monta-icon { transform: scale(1.15); }
    .monta-text { font-size: 13px; font-weight: 700; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.2s; }
    .monta-btn.active .monta-text { color: var(--green-light); }
    .monta-caption { font-size: 13px; color: var(--text3); text-align: center; }
    .monta-caption.on { color: var(--green); font-weight: 500; }
    .others-wrap { width: 100%; max-width: 380px; }
    .others-heading { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .others-list { display: flex; flex-direction: column; gap: 8px; }
    .other-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: var(--radius-sm); animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }
    .other-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; }
    .other-name { font-size: 14px; font-weight: 600; color: var(--green-light); flex: 1; }
    .other-tag { font-size: 11px; color: var(--green); }
    .no-others { font-size: 13px; color: var(--text3); }
    .logout-btn { background: none; border: none; font-size: 12px; color: var(--text3); cursor: pointer; padding: 0.5rem; }
    .logout-btn:hover { color: var(--text2); }
    .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 1.25rem); left: 50%; transform: translateX(-50%) translateY(120px); background: var(--bg3); border: 1px solid var(--green-border); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; gap: 10px; width: calc(100% - 2.5rem); max-width: 360px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; flex-shrink: 0; }
    .toast-title { font-size: 13px; font-weight: 700; color: var(--green-light); }
    .toast-msg { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 9999; transition: opacity 0.3s; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; }
    .loading-text { font-size: 14px; color: var(--text3); }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <img src="app_icon.png" class="loading-logo" alt="">
  <p class="loading-text">Cargando...</p>
</div>

<div class="screen hidden" id="pickScreen">
  <div class="pick-inner">
    <div class="logo-wrap">
      <img src="app_icon.png" class="logo-img" alt="LetsMonta!">
      <div class="logo-title">LetsMonta!</div>
      <div class="logo-sub">¿Quién está de monta hoy?</div>
    </div>
    <p class="pick-label">Elige tu perfil</p>
    <div class="profiles-grid" id="profilesGrid"></div>
  </div>
</div>

<div class="screen hidden" id="mainScreen">
  <div class="topbar">
    <span class="topbar-logo">LetsMonta! 🍻</span>
    <div class="topbar-user">
      <img class="topbar-avatar" id="topbarAvatar" src="" alt="">
      <span class="topbar-name" id="topbarName"></span>
    </div>
  </div>
  <div class="main-body">
    <div class="monta-wrap">
      <div class="monta-btn" id="montaBtn" onclick="toggleMonta()">
        <div class="monta-btn-inner">
          <span class="monta-icon">🔥</span>
          <span class="monta-text" id="montaText">Modo Monta</span>
        </div>
      </div>
      <p class="monta-caption" id="montaCaption">Pulsa para activar</p>
    </div>
    <div class="others-wrap">
      <p class="others-heading">También en modo monta</p>
      <div class="others-list" id="othersList">
        <p class="no-others">Nadie más de momento...</p>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">← Cambiar de perfil</button>
  </div>
</div>

<div class="toast" id="toast">
  <img class="toast-av" id="toastAv" src="" alt="">
  <div>
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-msg">¡También está en modo monta! 🔥</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyAg6VpZZSlfS7zXuH8aklndJKgLlM1SmCM",
  authDomain: "letsmonta.firebaseapp.com",
  databaseURL: "https://letsmonta-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "letsmonta",
  storageBucket: "letsmonta.firebasestorage.app",
  messagingSenderId: "827368602785",
  appId: "1:827368602785:web:d6df974b604243579d04e0"
};

const VAPID_KEY = "BPW1z89E8Uw5308WBIWh7S9k2tjR31NHwGOEikYOEjoLtmi0-6woGrS93ETEgDsJMPGLp0fbf5RAbBJHU_dfKCI";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messaging = getMessaging(app);

const MEMBERS = [
  { id: 'Monir',   name: 'Monir',     avatar: 'avatars/Monir.png' },
  { id: 'Bego',    name: 'Bego',      avatar: 'avatars/Bego.png' },
  { id: 'David',   name: 'David',     avatar: 'avatars/David.png' },
  { id: 'Bea',     name: 'Bea',       avatar: 'avatars/Bea.png' },
  { id: 'Miriam',  name: 'Miriam',    avatar: 'avatars/Miriam.png' },
  { id: 'Edu',     name: 'Edu',       avatar: 'avatars/Edu.png' },
  { id: 'MiriamG', name: 'Miriam G.', avatar: 'avatars/MiriamG.png' },
  { id: 'Pincho',  name: 'Pincho',    avatar: 'avatars/Pincho.png' },
  { id: 'Pipe',    name: 'Pipe',      avatar: 'avatars/Pipe.png' },
  { id: 'Sheyla',  name: 'Sheyla',    avatar: 'avatars/Sheyla.png' },
  { id: 'Maria',   name: 'María',     avatar: 'avatars/Maria.png' },
  { id: 'Kiki',    name: 'Kiki',      avatar: 'avatars/Kiki.png' },
  { id: 'Idoia',   name: 'Idoia',     avatar: 'avatars/Idoia.png' },
];

const SESSION_KEY = 'letsmonta_session';
let currentUser = null;
let toastTimeout = null;
let prevActiveIds = [];
let unsubscribeActive = null;
let unsubscribeTaken = null;

function getMember(id) { return MEMBERS.find(m => m.id === id); }

// ── NOTIFICACIONES PUSH ──
async function setupPush(userId) {
  try {
    if (!('Notification' in window)) return;
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    await navigator.serviceWorker.register('/letsmonta/firebase-messaging-sw.js');
    const sw = await navigator.serviceWorker.ready;

    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: sw });
    if (token) {
      await set(ref(db, `tokens/${userId}`), token);
    }

    // Notificación cuando la app está en primer plano
    onMessage(messaging, payload => {
      const m = getMember(payload.data?.senderId);
      if (m) showToast(m);
    });
  } catch (e) {
    console.log('Push no disponible:', e.message);
  }
}

// ── INIT ──
async function init() {
  const savedId = localStorage.getItem(SESSION_KEY);
  if (savedId) {
    const snap = await get(ref(db, `taken/${savedId}`));
    if (snap.exists() && snap.val() === savedId) {
      currentUser = getMember(savedId);
      if (currentUser) {
        hideLoading();
        showMain();
        return;
      }
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  }
  hideLoading();
  showPick();
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// ── PICK SCREEN ──
function showPick() {
  document.getElementById('pickScreen').classList.remove('hidden');
  document.getElementById('mainScreen').classList.add('hidden');
  if (unsubscribeTaken) unsubscribeTaken();
  unsubscribeTaken = onValue(ref(db, 'taken'), snap => {
    renderPick(snap.val() || {});
  });
}

function renderPick(taken) {
  const grid = document.getElementById('profilesGrid');
  grid.innerHTML = '';
  MEMBERS.forEach(m => {
    const isTaken = taken[m.id] && taken[m.id] !== currentUser?.id;
    const card = document.createElement('div');
    card.className = 'profile-card' + (isTaken ? ' taken' : '');
    card.innerHTML = `
      <img class="p-avatar" src="${m.avatar}" alt="${m.name}" loading="lazy">
      <span class="p-name">${m.name}</span>
      ${isTaken ? '<span class="p-taken">ocupado</span>' : ''}
    `;
    if (!isTaken) card.onclick = () => pickProfile(m.id);
    grid.appendChild(card);
  });
}

async function pickProfile(id) {
  if (unsubscribeTaken) { unsubscribeTaken(); unsubscribeTaken = null; }
  await set(ref(db, `taken/${id}`), id);
  localStorage.setItem(SESSION_KEY, id);
  currentUser = getMember(id);
  showMain();
}

// ── MAIN SCREEN ──
function showMain() {
  document.getElementById('pickScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  document.getElementById('topbarAvatar').src = currentUser.avatar;
  document.getElementById('topbarName').textContent = currentUser.name;

  setupPush(currentUser.id);

  if (unsubscribeActive) unsubscribeActive();
  unsubscribeActive = onValue(ref(db, 'active'), snap => {
    const active = snap.val() || {};
    const id = currentUser.id;
    const newActiveIds = Object.keys(active).filter(k => k !== id);
    newActiveIds.filter(k => !prevActiveIds.includes(k)).forEach(k => {
      const m = getMember(k);
      if (m) showToast(m);
    });
    prevActiveIds = newActiveIds;
    renderMain(active);
  });

  window.addEventListener('beforeunload', cleanup);
}

function renderMain(active) {
  const id = currentUser.id;
  const isOn = !!active[id];
  const btn = document.getElementById('montaBtn');
  btn.classList.toggle('active', isOn);
  document.getElementById('montaText').textContent = isOn ? '¡Activo!' : 'Modo Monta';
  const caption = document.getElementById('montaCaption');
  caption.textContent = isOn ? '¡Estás en modo monta! 🔥' : 'Pulsa para activar';
  caption.className = 'monta-caption' + (isOn ? ' on' : '');

  const others = Object.keys(active).filter(k => k !== id);
  const list = document.getElementById('othersList');
  list.innerHTML = '';
  if (others.length === 0) {
    list.innerHTML = '<p class="no-others">Nadie más de momento...</p>';
  } else {
    others.forEach(k => {
      const m = getMember(k);
      if (!m) return;
      const row = document.createElement('div');
      row.className = 'other-row';
      row.innerHTML = `
        <img class="other-avatar" src="${m.avatar}" alt="${m.name}">
        <span class="other-name">${m.name}</span>
        <span class="other-tag">en modo monta 🔥</span>
      `;
      list.appendChild(row);
    });
  }
}

window.toggleMonta = async function() {
  const id = currentUser.id;
  const snap = await get(ref(db, `active/${id}`));
  if (snap.exists()) {
    await remove(ref(db, `active/${id}`));
  } else {
    await set(ref(db, `active/${id}`), Date.now());
    // Enviar notificación push a todos los demás que estén activos
    await sendPushToOthers(id);
  }
};

async function sendPushToOthers(senderId) {
  // Guardamos en Firebase que hay una nueva activación, el SW lo detecta
  await set(ref(db, `notify`), {
    senderId,
    senderName: currentUser.name,
    ts: Date.now()
  });
}

function showToast(member) {
  document.getElementById('toastAv').src = member.avatar;
  document.getElementById('toastTitle').textContent = member.name;
  const t = document.getElementById('toast');
  t.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 4000);
}

async function cleanup() {
  if (!currentUser) return;
  await remove(ref(db, `active/${currentUser.id}`));
}

window.logout = async function() {
  if (unsubscribeActive) { unsubscribeActive(); unsubscribeActive = null; }
  if (currentUser) {
    await remove(ref(db, `active/${currentUser.id}`));
    await remove(ref(db, `taken/${currentUser.id}`));
    await remove(ref(db, `tokens/${currentUser.id}`));
  }
  localStorage.removeItem(SESSION_KEY);
  currentUser = null;
  prevActiveIds = [];
  document.getElementById('mainScreen').classList.add('hidden');
  showPick();
};

init();
</script>
</body>
</html>
